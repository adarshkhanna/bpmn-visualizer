{{if .Error}}
<div class="error-message">
    <p><strong>Error:</strong> {{.Error}}</p>
    <p>Please check the GCS URI and ensure the file exists and is accessible.</p>
</div>
{{else}}
<div id="bpmn-viewer-container"></div> <!-- Ensure this ID is unique if index.html also has one -->
<script>
  (function() {
    var bpmnXML = `{{.BPMNXMLDataJS}}`; // Injected by Go template

    // Check if BpmnJS is available
    if (typeof BpmnJS === 'undefined') {
        console.error('BpmnJS is not loaded!');
        var container = document.getElementById('bpmn-viewer-container');
        if(container) {
            container.innerHTML = '<p class="error-message">Critical Error: BpmnJS library not found. Please check browser console.</p>';
        }
        return;
    }

    var viewerContainer = document.getElementById('bpmn-viewer-container');
    if (!viewerContainer) {
        console.error('BPMN viewer container (bpmn-viewer-container) not found in the fragment.');
        // Try to append error to diagram-output-area if main container is missing
        var outputArea = document.getElementById('diagram-output-area');
        if(outputArea){
            var err = document.createElement('p');
            err.className = 'error-message';
            err.innerText = 'Error: Viewer container element is missing in the server response.';
            outputArea.appendChild(err);
        }
        return;
    }
    
    // Ensure the container is empty before initializing (prevents issues on re-renders)
    while (viewerContainer.firstChild) {
        viewerContainer.removeChild(viewerContainer.firstChild);
    }

    var bpmnViewer = new BpmnJS({
      container: viewerContainer // Use the actual DOM element
    });

    async function importDiagram(xml) {
      try {
        // Check if XML is empty or placeholder, which might indicate an upstream issue not caught as an .Error
        if (!xml || xml.trim() === "") {
            console.error('Received empty BPMN XML data.');
            viewerContainer.innerHTML = '<p class="error-message">Error: Received empty BPMN data from server.</p>';
            return;
        }
        const result = await bpmnViewer.importXML(xml);
        if (result && result.warnings && result.warnings.length) {
            console.warn('BPMN import warnings:', result.warnings);
        }
        bpmnViewer.get('canvas').zoom('fit-viewport');
        console.log('BPMN diagram loaded successfully.');

        // --- BEGIN DECISION VISUALIZER LOGIC ---
        initializeInteractivity(bpmnViewer);
        // --- END DECISION VISUALIZER LOGIC ---

      } catch (err) {
        console.error('Could not import BPMN 2.0 diagram:', err);
        viewerContainer.innerHTML = '<p class="error-message">Error loading BPMN diagram: ' + err.message + '</p>' +
                                    '<p>Ensure the file is valid BPMN 2.0 XML.</p>' +
                                    '<details><summary>Received XML (first 500 chars)</summary><pre>' +
                                    xml.substring(0, 500).replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                                    '...</pre></details>';
      }
    }

    function initializeInteractivity(viewer) {
        const eventBus = viewer.get('eventBus');
        const canvas = viewer.get('canvas');
        const elementRegistry = viewer.get('elementRegistry');
        let highlightedElements = [];

        // Function to clear existing highlights
        function clearHighlights() {
            highlightedElements.forEach(el => {
                canvas.removeMarker(el.id, 'highlight');
                if(el.type === 'bpmn:SequenceFlow') {
                    // Manually reset stroke color for sequence flows if marker is not enough
                    const gfx = elementRegistry.getGraphics(el.id);
                    if(gfx) {
                        gfx.style.stroke = '#000'; // Reset to default color
                    }
                }
            });
            highlightedElements = [];
        }

        // Function to highlight a path
        function highlightPath(startElement) {
            clearHighlights();

            // Highlight the gateway itself
            canvas.addMarker(startElement.id, 'highlight');
            highlightedElements.push(startElement);

            // If it's a gateway, highlight the first outgoing path
            if (startElement.businessObject.outgoing && startElement.businessObject.outgoing.length > 0) {
                const sequenceFlow = startElement.businessObject.outgoing[0]; // Take the first path
                const sequenceFlowElement = elementRegistry.get(sequenceFlow.id);
                if (sequenceFlowElement) {
                    canvas.addMarker(sequenceFlow.id, 'highlight');
                    highlightedElements.push(sequenceFlowElement);

                    // Highlight the target of the sequence flow
                    const targetElement = elementRegistry.get(sequenceFlow.targetRef.id);
                    if (targetElement) {
                        canvas.addMarker(targetElement.id, 'highlight');
                        highlightedElements.push(targetElement);
                    }
                }
            }
        }

        eventBus.on('element.click', function(event) {
            const element = event.element;

            // Only react to clicks on exclusive or inclusive gateways
            if (element.type === 'bpmn:ExclusiveGateway' || element.type === 'bpmn:InclusiveGateway') {
                console.log('Gateway clicked:', element);
                highlightPath(element);
            }
        });

        console.log('Decision visualizer interactivity initialized.');
    }

    if (bpmnXML) {
      importDiagram(bpmnXML);
    } else {
      // This case should ideally be handled by the {{if .Error}} block in Go template,
      // but as a fallback for the script:
      console.error('No BPMN XML data received from server (script check).');
      viewerContainer.innerHTML = '<p class="error-message">Error: No BPMN XML data was provided to the viewer script.</p>';
    }
  })();
</script>
{{end}}
